# Lakeflow Job (Databricks Jobs) do pipeline MVP Brasileirão 2025
# Pra usar: Jobs & Pipelines > Create job > menu "⋮" > "Edit as YAML" e cola este conteúdo.
# Lembrar de ajustar o caminho do Git folder em notebook_path. Compute: serverless (padrão do Free Edition).
# Cada tarefa depende da anterior, mesma ordem do 99_pipeline_orquestrador.
resources:
  jobs:
    mvp_brasileirao_pipeline:
      name: mvp_brasileirao_pipeline
      parameters:
        - name: catalogo
          default: mvp_brasileirao
      tasks:
        - task_key: setup
          notebook_task: {notebook_path: /Workspace/Users/<seu_email>/mvp_pucrj_eng_de_dados/notebooks/01_setup_ambiente}
        - task_key: bronze
          depends_on: [{task_key: setup}]
          notebook_task: {notebook_path: /Workspace/Users/<seu_email>/mvp_pucrj_eng_de_dados/notebooks/02_bronze_ingestao}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: /Workspace/Users/<seu_email>/mvp_pucrj_eng_de_dados/notebooks/03_silver_transformacao}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: /Workspace/Users/<seu_email>/mvp_pucrj_eng_de_dados/notebooks/04_gold_modelagem}
        - task_key: qualidade
          depends_on: [{task_key: gold}]
          notebook_task: {notebook_path: /Workspace/Users/<seu_email>/mvp_pucrj_eng_de_dados/notebooks/05_qualidade_dados}
        - task_key: catalogo
          depends_on: [{task_key: qualidade}]
          notebook_task: {notebook_path: /Workspace/Users/<seu_email>/mvp_pucrj_eng_de_dados/notebooks/06_catalogo_dados}
        - task_key: analise
          depends_on: [{task_key: catalogo}]
          notebook_task: {notebook_path: /Workspace/Users/<seu_email>/mvp_pucrj_eng_de_dados/notebooks/07_analise_perguntas}
